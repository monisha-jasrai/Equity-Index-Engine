# India Large-Cap 40 Index — methodology configuration
# Universe note: the candidate list below is a FIXED list of today's large caps, so every
# backtest is a fixed-candidate-universe study (survivorship bias; see README).
# Every rule of the index lives here, so the methodology is auditable and changing it
# never requires touching code.

index:
  name: "India Large-Cap 40"
  base_value: 1000.0
  start_date: "2016-01-01"
  end_date: "2025-12-31"
  currency: INR

data:
  source: yahoo            # yahoo | synthetic
  cache_dir: data/cache
  benchmark_ticker: "^NSEI"  # NIFTY 50 (price return) - compared with the index's PRICE return
  # Optional NIFTY 50 Total Returns Index (TRI) CSV, e.g. downloaded from niftyindices.com
  # (historical data -> "NIFTY 50" -> Total Returns Index). Needs a date column and a value column.
  # When set, the index's TOTAL return is compared with it (TR vs TRI). Without it, no TR
  # comparison is made, because comparing TR with a price index would flatter the index.
  benchmark_tri_file: null         # e.g. data/nifty50_tri.csv
  synthetic_seed: 42
  # Optional point-in-time shareholding patterns (e.g. exported from Capitaline):
  # CSV with columns date, ticker, shares_outstanding, promoter_holding_pct.
  # When set, IWF = 1 - promoter holding and the index becomes genuinely free-float weighted.
  shareholding_file: null          # e.g. data/shareholding.csv
  shareholding_lag_days: 21        # patterns are published ~3 weeks after quarter-end

selection:
  n_constituents: 40
  # Buffer rule: an existing member keeps its seat while its float-adjusted market-cap
  # rank is <= retain_rank. Reduces turnover from names oscillating around rank 40.
  retain_rank: 48
  min_history_days: 126          # ~6 months of trading history before eligible
  liquidity_lookback_days: 126
  min_median_traded_value: 5.0e8   # INR, median daily traded value over lookback
  reference_lag_days: 5          # selection data snapshotted 5 trading days before effective date (no look-ahead)

weighting:
  scheme: capped_market_cap      # market_cap | capped_market_cap | equal | inverse_vol | sqrt_cap
  single_stock_cap: 0.10
  sector_cap: 0.35
  vol_lookback_days: 252

rebalance:
  frequency: quarterly           # monthly | quarterly | semiannual | annual
  # rebalanced on the last trading day of Mar / Jun / Sep / Dec

costs:
  transaction_cost_bps: 10       # per unit of traded notional (one side), applied to the investable "net" series

analytics:
  risk_free_rate: 0.065          # annual, approx. Indian 91-day T-bill
  periods_per_year: 252
  rolling_window_days: 252
  bootstrap_samples: 2000
  bootstrap_block_days: 20

# Variants backtested side by side for the methodology comparison
variants:
  - capped_market_cap
  - market_cap
  - equal
  - inverse_vol
  - sqrt_cap

# Candidate universe (NSE tickers on Yahoo use the .NS suffix) with GICS-style sectors.
