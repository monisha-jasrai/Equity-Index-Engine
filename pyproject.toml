[project]
name = "equity-index-engine"
version = "1.0.0"
description = "Rules-based construction and back-testing of a capped, free-float market-cap weighted equity index"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "pandas>=2.1", "matplotlib>=3.8", "pyyaml>=6.0", "yfinance>=0.2.40"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools]
packages = ["index_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
